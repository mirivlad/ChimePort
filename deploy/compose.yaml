services:
  chimeport:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      CHIMEPORT_DATA_DIR: /data
      CHIMEPORT_LISTEN_ADDR: ":8080"
      CHIMEPORT_PUBLIC_URL: ${CHIMEPORT_PUBLIC_URL:?Set the public HTTPS origin}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - chimeport_data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/chimeport", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  chimeport_data:
