# Portainer Git stack: refs/heads/main, deploy/compose.portainer.yaml
# The GHCR publisher also produces immutable sha-<full commit> image tags.
# To restore safely, mount an EMPTY restored host directory by setting CHIMEPORT_DATA_MOUNT.
# The original named volume remains untouched for rollback.
# For a reverse proxy running on the host, forward to 127.0.0.1:8080.
# For a proxy in Docker, add a shared external Docker network.
services:
  chimeport:
    image: ${CHIMEPORT_IMAGE:-ghcr.io/mirivlad/chimeport:v0.1.2}
    restart: unless-stopped
    environment:
      CHIMEPORT_DATA_DIR: /data
      CHIMEPORT_LISTEN_ADDR: ":8080"
      CHIMEPORT_PUBLISH_RATE_PER_MINUTE: ${CHIMEPORT_PUBLISH_RATE_PER_MINUTE:-120}
      CHIMEPORT_RETENTION_DAYS: ${CHIMEPORT_RETENTION_DAYS:-30}
      CHIMEPORT_PUBLIC_URL: ${CHIMEPORT_PUBLIC_URL:-https://chime.mirv.top}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${CHIMEPORT_DATA_MOUNT:-chimeport_data}:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/chimeport", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  chimeport_data:
