name: Publish ChimePort v0.1.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify Go server
        working-directory: server
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish v0.1.2 server image (amd64/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mirivlad/chimeport:v0.1.2
            ghcr.io/mirivlad/chimeport:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mirivlad/ChimePort
            org.opencontainers.image.version=v0.1.2
            org.opencontainers.image.licenses=AGPL-3.0-only

  release:
    needs: [server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release v0.1.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.1.2 >/dev/null 2>&1; then
            echo "Release v0.1.2 already exists; leaving the published release unchanged"
            exit 0
          fi
          gh release create v0.1.2 \
            --target "$GITHUB_SHA" \
            --title "ChimePort v0.1.2" \
            --notes-file docs/releases/v0.1.2.md \
            --latest
