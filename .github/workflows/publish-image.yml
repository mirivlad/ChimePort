name: Publish experimental Docker image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3
      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mirivlad/chimeport:main
            ghcr.io/mirivlad/chimeport:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mirivlad/ChimePort
            org.opencontainers.image.description=ChimePort self-hosted notification server (experimental)
