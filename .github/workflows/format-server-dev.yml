name: Format Go backup feature branch
on:
  push:
    branches: [feat/server-backup-recovery]
    paths:
      - "server/**"
      - ".github/workflows/format-server-dev.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'mirivlad/ChimePort'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format new Go files
        run: |
          gofmt -w server/cmd/chimeport/main.go server/internal/app/store.go server/internal/maintenance/maintenance.go server/internal/maintenance/maintenance_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/cmd/chimeport/main.go server/internal/app/store.go server/internal/maintenance/
          if ! git diff --cached --quiet; then
            git commit -m "style(server): apply gofmt to backup maintenance"
            git push origin HEAD:feat/server-backup-recovery
          fi
