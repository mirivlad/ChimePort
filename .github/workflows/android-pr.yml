name: Android PR validation
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-pr.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install platform
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validate pinned signing fingerprint
        shell: bash
        run: |
          expected="$(tr -d '[:space:]' < android/signing/expected-alpha-sha256.txt)"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
      - name: Audit existing alpha APK signing certificates
        shell: bash
        run: bash android/scripts/audit-released-apks.sh
      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chimeport-android-pr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
