name: Android PR validation
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-pr.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chimeport-android-pr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
