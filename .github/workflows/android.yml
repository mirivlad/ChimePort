name: Android APK and prerelease
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prefer pinned signing key from protected Actions secret
        shell: bash
        env:
          CHIMEPORT_ALPHA_KEYSTORE_B64: ${{ secrets.CHIMEPORT_ALPHA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$CHIMEPORT_ALPHA_KEYSTORE_B64" ]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$CHIMEPORT_ALPHA_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "CHIMEPORT_SIGNING_SOURCE=secret" >> "$GITHUB_ENV"
            echo "Signing keystore restored from GitHub Actions Secrets"
          else
            echo "CHIMEPORT_SIGNING_SOURCE=cache" >> "$GITHUB_ENV"
            echo "::notice::Signing secret not configured yet; using pinned Actions cache as temporary fallback"
          fi
      - name: Restore pinned alpha signing identity from legacy cache
        if: env.CHIMEPORT_SIGNING_SOURCE == 'cache'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chimeport-alpha-debug-signing-v1
      - name: Require pinned alpha signing identity
        shell: bash
        run: |
          set -euo pipefail
          key="$HOME/.android/debug.keystore"
          if [ ! -f "$key" ]; then
            echo "::error::The pinned alpha keystore is missing from both GitHub Secrets and legacy cache. Refusing to rotate signing certificate."
            exit 1
          fi
          echo "CHIMEPORT_SIGNING_KEYSTORE=$key" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$key" -storepass android \
            -alias androiddebugkey | grep 'SHA256:'
      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug-signed APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ChimePort-android-alpha.apk
          cd dist
          sha256sum ChimePort-android-alpha.apk > SHA256SUMS.txt
      - name: Verify actual distributable APK signing certificate
        shell: bash
        run: bash android/scripts/verify-distribution-signature.sh dist/ChimePort-android-alpha.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChimePort-android-apk
          path: dist/
      - name: Publish GitHub prerelease from main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="android-alpha-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             dist/ChimePort-android-alpha.apk             dist/SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "ChimePort Android alpha · build ${GITHUB_RUN_NUMBER}"             --notes "Installable alpha APK for testing: per-channel sounds, vibration and priority; grouped notifications; tap to open an event. Optional background foreground-service delivery is best effort; force-stop and battery restrictions can interrupt it. Signed and checked against pinned alpha certificate; not a production-signed build."             --prerelease --latest=false
