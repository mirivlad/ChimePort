name: Android APK and prerelease
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore persistent alpha signing identity
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chimeport-alpha-debug-signing-v1
      - name: Require pinned alpha signing identity
        shell: bash
        run: |
          set -euo pipefail
          key="$HOME/.android/debug.keystore"
          if [ ! -f "$key" ]; then
            echo "::error::The pinned alpha keystore is missing. Refusing to publish an APK with a new certificate."
            exit 1
          fi
          echo "CHIMEPORT_SIGNING_KEYSTORE=$key" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$key" -storepass android \
            -alias androiddebugkey | grep 'SHA256:'
      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug-signed APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ChimePort-android-alpha.apk
          cd dist
          sha256sum ChimePort-android-alpha.apk > SHA256SUMS.txt
      - name: Verify actual distributable APK signing certificate
        shell: bash
        run: bash android/scripts/verify-distribution-signature.sh dist/ChimePort-android-alpha.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChimePort-android-apk
          path: dist/
      - name: Publish GitHub prerelease from main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="android-alpha-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             dist/ChimePort-android-alpha.apk             dist/SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "ChimePort Android alpha · build ${GITHUB_RUN_NUMBER}"             --notes "Installable debug-signed APK for personal testing. Not production-signed. Background push is not yet implemented. Android may require uninstall when debug signatures change between CI runs."             --prerelease --latest=false
